name = "sigad-tchad"
main = "backend/src/index.ts"
compatibility_date = "2026-10-22"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "sigad-base"
database_id = "0cc2b4ec-bd2d-47ad-b804-42889957d1dc"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sigad-documents"
preview_bucket_name = "sigad-documents-local"

[assets]
directory = "frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1.0

[observability.traces]
enabled = true
head_sampling_rate = 0.1
